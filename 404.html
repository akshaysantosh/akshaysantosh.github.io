<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Akshay Santosh</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css?v=8" />
  <script>
    /* Paper grain: a 128px speckle tile (28% of pixels, alpha up to 25%, warm brown), drawn at 1.5x
       and repeated. Same recipe as the apps' PaperBackground. Deterministic, no image file. */
    (function () {
      try {
        var n = 128, c = document.createElement('canvas'); c.width = c.height = n;
        var ctx = c.getContext('2d'), img = ctx.createImageData(n, n), s = 1234567;
        var rnd = function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
        for (var i = 0; i < n * n; i++) {
          var a = rnd() < 0.28 ? 1 + Math.floor(rnd() * 64) : 0;
          img.data[i * 4] = 90; img.data[i * 4 + 1] = 70; img.data[i * 4 + 2] = 45; img.data[i * 4 + 3] = a;
        }
        ctx.putImageData(img, 0, 0);
        document.documentElement.style.setProperty('--paper-grain', 'url(' + c.toDataURL() + ')');
        /* Specks are 2 device pixels wide on dense (phone) screens, 1 on standard ones. */
        var d = window.devicePixelRatio || 1;
        document.documentElement.style.setProperty('--paper-size', (d >= 2 ? 256 / d : 128) + 'px');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main>
    <section class="hero">
      <p class="notfound-code">404</p>
      <h1>Nothing here</h1>
      <p class="tagline">That page doesn't exist — but here's where you probably meant to go.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">Back to homepage</a>
        <a class="btn btn-secondary" href="https://www.linkedin.com/in/akshaysantosh/" target="_blank" rel="noopener noreferrer">Connect on LinkedIn</a>
      </div>
    </section>
  </main>
</body>
</html>
